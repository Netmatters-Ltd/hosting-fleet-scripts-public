# Publishes a release when a tag r<NNNN> is pushed for a commit on main.
# Builds with make-release.sh and attaches release-<N>.tar and its .sha256.
#
# Third-party actions are pinned to a full commit SHA, so a
# compromised action tag can't change what gets built.
name: Publish release

on:
  push:
    tags: ['r[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check the tag matches LATEST and is on main
        run: |
          tag="${GITHUB_REF_NAME}"
          rel="$(tr -d '[:space:]' < LATEST)"
          [ "$tag" = "r$rel" ] || { echo "Tag $tag does not match LATEST ($rel)"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }

      - name: Build
        run: ./make-release.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="$(tr -d '[:space:]' < LATEST)"
          notes="$(sed -n 's/.*"notes"[[:space:]]*:[[:space:]]*"\(.*\)".*/\1/p' release.json | head -1)"
          gh release create "r$rel" dist/release-$rel.tar dist/release-$rel.tar.sha256 \
            --title "Release $rel" --notes "${notes:-Release $rel}" --verify-tag
